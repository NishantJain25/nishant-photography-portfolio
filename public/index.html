<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!--
      Defaults for crawlers and link previews that don't run JavaScript. Each page
      replaces these as it loads (see src/components/Seo.jsx). If the site moves
      to a custom domain, update the URLs here and in src/constants/seo.js.
    -->
    <meta
      name="description"
      content="Nishant Jain is a Mumbai-based photographer specialising in portrait, event, product and interior photography. Browse selected projects and get in touch for a shoot."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nishant Jain Photography" />
    <meta property="og:title" content="Nishant Jain | Photographer in Mumbai" />
    <meta
      property="og:description"
      content="Portrait, event, product and interior photography by Mumbai-based photographer Nishant Jain."
    />
    <meta
      property="og:image"
      content="https://nishantjainphotography.netlify.app/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="google-site-verification" content="kAzGbRHJWkf6eSUkVdK402u4ljUWS32y0BATd_pFs7w" />
    <!--
      Placeholder only: after each build, scripts/add-structured-data.js replaces
      this with your name, location and social links from Site settings in Sanity.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://nishantjainphotography.netlify.app/#person",
            "name": "Nishant Jain",
            "url": "https://nishantjainphotography.netlify.app/"
          },
          {
            "@type": "WebSite",
            "name": "Nishant Jain Photography",
            "url": "https://nishantjainphotography.netlify.app/",
            "publisher": {
              "@id": "https://nishantjainphotography.netlify.app/#person"
            }
          }
        ]
      }
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Font Families -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Bitcount+Grid+Double:wght@100..900&display=swap" rel="stylesheet">
    
    <title>Nishant Jain | Photographer in Mumbai</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      Netlify finds forms by reading this file at deploy time, and can't see ones
      React renders later. Keep these fields in sync with ContactSection.jsx.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="company" hidden>
      <input name="email" />
      <textarea name="message"></textarea>
      <input name="company" />
    </form>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
